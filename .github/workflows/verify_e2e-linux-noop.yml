# NO-OP placeholder that always passes for other paths
# This is here so that we're able to set the status check as required

name: E2E Linux Void
on:
  pull_request:
    paths:
      - '.changeset/**'
      - 'contrib/**'
      - 'docs/**'
      - 'microsite/**'
      - 'beps/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  noop:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    name: E2E Linux ${{ matrix.node-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - run: echo NOOP

  noop-pnpm:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pnpm-version: [11.28.0, 12.7.0]
        node-linker: [hoisted, isolated]

    name: E2E Linux pnpm ${{ matrix.pnpm-version }} ${{ matrix.node-linker }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - run: echo NOOP
